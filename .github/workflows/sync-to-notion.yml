name: Sync KB to Notion

on:
  push:
    branches: [main]
    paths: ["**.md"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-frontmatter notion-client -q

      - name: Sync changed files to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_NOTES_DB_ID }}
        run: python scripts/sync_to_notion.py
