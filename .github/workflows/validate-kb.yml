name: Validate NSE Knowledge + Skills

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "scripts/validate_frontmatter.py"
      - "scripts/validate_skills.py"
  pull_request:
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "scripts/validate_frontmatter.py"
      - "scripts/validate_skills.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-frontmatter mkdocs-material -q

      - name: Validate NSE knowledge-note front matter
        run: python scripts/validate_frontmatter.py

      - name: Validate executable Agent Skills
        run: python scripts/validate_skills.py

      - name: Build human-readable knowledge surface
        run: mkdocs build --strict
